# Netlify reads this from the repo root.
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: every unknown path must return index.html with HTTP 200,
# otherwise deep links like /jobs return a real 404 and Google refuses to index.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify only (Vercel ignores this file). Netlify sites that build this repo
# (e.g. examresizer.netlify.app) serve the same pages as photoresizer.click,
# so they are kept out of search results rather than competing with it as
# duplicates. The canonical host is Vercel.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
